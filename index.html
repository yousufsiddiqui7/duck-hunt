<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Duck Hunt</title>
    <meta name="description" content="A retro Duck Hunt arcade game featuring authentic 8-bit visuals, synthesized audio, animated ducks, and the iconic dog." />
    <meta property="og:title" content="Duck Hunt" />
    <meta property="og:description" content="A retro Duck Hunt arcade game featuring authentic 8-bit visuals, synthesized audio, animated ducks, and the iconic dog." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-user-select: none;
      }
      
      @font-face {
        font-family: 'PressStart2P';
        src: local('Press Start 2P'), local('Courier New'), monospace;
      }

      body {
        background-color: #0b0d13;
        color: #ffffff;
        font-family: 'PressStart2P', 'Courier New', monospace;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        overflow: hidden;
        margin: 0;
        padding: 8px;
      }

      #game-wrapper {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100%;
        max-width: 960px;
        aspect-ratio: 4 / 3;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.9), 0 0 0 8px #1a1e29, 0 0 0 12px #0f1219;
        border-radius: 12px;
        background: #000000;
        overflow: hidden;
      }

      #game-canvas {
        width: 100%;
        height: 100%;
        display: block;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        cursor: crosshair;
        touch-action: none;
      }

      /* CRT Scanline Filter Overlay (Toggleable) */
      .crt-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        background: linear-gradient(
          rgba(18, 16, 16, 0) 50%, 
          rgba(0, 0, 0, 0.28) 50%
        ), linear-gradient(
          90deg,
          rgba(255, 0, 0, 0.03),
          rgba(0, 255, 0, 0.01),
          rgba(0, 0, 255, 0.03)
        );
        background-size: 100% 4px, 6px 100%;
        border-radius: 12px;
        z-index: 10;
      }

      .crt-overlay.disabled {
        display: none;
      }

      /* Top Quick Controls Bar */
      #top-bar {
        position: absolute;
        top: 10px;
        right: 14px;
        display: flex;
        gap: 8px;
        z-index: 30;
      }

      .icon-btn {
        background: rgba(15, 18, 25, 0.75);
        border: 2px solid #3b4252;
        color: #e5e9f0;
        padding: 6px 10px;
        font-family: inherit;
        font-size: 10px;
        border-radius: 6px;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 4px;
        backdrop-filter: blur(4px);
        transition: background 0.15s, border-color 0.15s, transform 0.1s;
      }

      .icon-btn:hover {
        background: rgba(35, 42, 58, 0.9);
        border-color: #88c0d0;
        transform: translateY(-1px);
      }

      .icon-btn:active {
        transform: translateY(1px);
      }

      #game-footer-info {
        margin-top: 10px;
        font-size: 11px;
        color: #6c768a;
        text-align: center;
        letter-spacing: 1px;
        line-height: 1.4;
      }

      #game-footer-info span {
        color: #a3be8c;
      }
    </style>
  </head>
  <body>
    <div id="game-wrapper">
      <canvas id="game-canvas" width="800" height="600"></canvas>
      <div id="crt-effect" class="crt-overlay"></div>
      
      <div id="top-bar">
        <button id="btn-sound" class="icon-btn" title="Toggle Sound (M)">🔊 AUDIO ON</button>
        <button id="btn-crt" class="icon-btn" title="Toggle CRT Scanlines">📺 CRT ON</button>
        <button id="btn-fullscreen" class="icon-btn" title="Toggle Fullscreen">⛶ EXPAND</button>
      </div>
    </div>

    <div id="game-footer-info">
      <span>CONTROLS:</span> AIM & LEFT CLICK / TAP TO SHOOT &bull; <span>[M]</span> SOUND &bull; <span>[P]</span> PAUSE
    </div>

    <script>
      (function () {
        'use strict';

        // --- WEB AUDIO API SYNTHESIZER ---
        let audioCtx = null;
        let isMuted = false;

        function initAudio() {
          if (!audioCtx) {
            const AudioContextClass = window.AudioContext || window.webkitAudioContext;
            if (AudioContextClass) {
              audioCtx = new AudioContextClass();
            }
          }
          if (audioCtx && audioCtx.state === 'suspended') {
            audioCtx.resume();
          }
        }

        function playGunshot() {
          if (isMuted || !audioCtx) return;
          try {
            const now = audioCtx.currentTime;

            // 1. Filtered White Noise blast
            const bufferSize = audioCtx.sampleRate * 0.25;
            const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const output = noiseBuffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
              output[i] = (Math.random() * 2 - 1) * Math.exp(-i / (audioCtx.sampleRate * 0.05));
            }

            const whiteNoise = audioCtx.createBufferSource();
            whiteNoise.buffer = noiseBuffer;

            const filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(1400, now);
            filter.frequency.exponentialRampToValueAtTime(80, now + 0.22);

            const noiseGain = audioCtx.createGain();
            noiseGain.gain.setValueAtTime(0.9, now);
            noiseGain.gain.exponentialRampToValueAtTime(0.01, now + 0.24);

            whiteNoise.connect(filter);
            filter.connect(noiseGain);
            noiseGain.connect(audioCtx.destination);
            whiteNoise.start(now);

            // 2. Punchy low-end thud oscillator
            const osc = audioCtx.createOscillator();
            const oscGain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(160, now);
            osc.frequency.exponentialRampToValueAtTime(30, now + 0.18);

            oscGain.gain.setValueAtTime(0.8, now);
            oscGain.gain.exponentialRampToValueAtTime(0.01, now + 0.18);

            osc.connect(oscGain);
            oscGain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.2);
          } catch (e) {
            console.error(e);
          }
        }

        function playEmptyClick() {
          if (isMuted || !audioCtx) return;
          try {
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'square';
            osc.frequency.setValueAtTime(800, now);
            osc.frequency.exponentialRampToValueAtTime(200, now + 0.04);
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.05);
          } catch (e) {}
        }

        function playQuack() {
          if (isMuted || !audioCtx) return;
          try {
            const now = audioCtx.currentTime;
            for (let i = 0; i < 2; i++) {
              const start = now + i * 0.11;
              const osc = audioCtx.createOscillator();
              const gain = audioCtx.createGain();
              osc.type = 'sawtooth';
              osc.frequency.setValueAtTime(540, start);
              osc.frequency.exponentialRampToValueAtTime(320, start + 0.09);

              const filter = audioCtx.createBiquadFilter();
              filter.type = 'bandpass';
              filter.frequency.value = 900;
              filter.Q.value = 4;

              gain.gain.setValueAtTime(0.18, start);
              gain.gain.exponentialRampToValueAtTime(0.01, start + 0.09);

              osc.connect(filter);
              filter.connect(gain);
              gain.connect(audioCtx.destination);
              osc.start(start);
              osc.stop(start + 0.1);
            }
          } catch (e) {}
        }

        function playWingFlap() {
          if (isMuted || !audioCtx) return;
          try {
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(300, now);
            osc.frequency.linearRampToValueAtTime(120, now + 0.06);

            gain.gain.setValueAtTime(0.12, now);
            gain.gain.exponentialRampToValueAtTime(0.005, now + 0.06);

            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.07);
          } catch (e) {}
        }

        function playHit() {
          if (isMuted || !audioCtx) return;
          try {
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'square';
            osc.frequency.setValueAtTime(980, now);
            osc.frequency.setValueAtTime(1300, now + 0.04);
            osc.frequency.setValueAtTime(700, now + 0.09);
            osc.frequency.linearRampToValueAtTime(200, now + 0.2);

            gain.gain.setValueAtTime(0.35, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.22);

            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.23);
          } catch (e) {}
        }

        function playFalling() {
          if (isMuted || !audioCtx) return;
          try {
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(800, now);
            osc.frequency.exponentialRampToValueAtTime(100, now + 0.65);

            gain.gain.setValueAtTime(0.2, now);
            gain.gain.linearRampToValueAtTime(0.2, now + 0.55);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.65);

            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.67);
          } catch (e) {}
        }

        function playThud() {
          if (isMuted || !audioCtx) return;
          try {
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(90, now);
            osc.frequency.exponentialRampToValueAtTime(30, now + 0.12);

            gain.gain.setValueAtTime(0.5, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);

            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.13);
          } catch (e) {}
        }

        function playDogBark() {
          if (isMuted || !audioCtx) return;
          try {
            const now = audioCtx.currentTime;
            for (let b = 0; b < 2; b++) {
              const start = now + b * 0.16;
              const osc = audioCtx.createOscillator();
              const gain = audioCtx.createGain();
              osc.type = 'sawtooth';
              osc.frequency.setValueAtTime(340, start);
              osc.frequency.exponentialRampToValueAtTime(160, start + 0.1);

              gain.gain.setValueAtTime(0.3, start);
              gain.gain.exponentialRampToValueAtTime(0.01, start + 0.11);

              osc.connect(gain);
              gain.connect(audioCtx.destination);
              osc.start(start);
              osc.stop(start + 0.12);
            }
          } catch (e) {}
        }

        function playDogLaugh() {
          if (isMuted || !audioCtx) return;
          try {
            const now = audioCtx.currentTime;
            // Authentic NES Duck Hunt snicker: staccato alternating bursts
            const notes = [784, 587, 784, 587, 784, 587, 784, 587, 784, 587, 784, 587];
            notes.forEach((freq, idx) => {
              const t = now + idx * 0.08;
              const osc = audioCtx.createOscillator();
              const gain = audioCtx.createGain();
              osc.type = 'square';
              osc.frequency.setValueAtTime(freq, t);

              gain.gain.setValueAtTime(0.24, t);
              gain.gain.exponentialRampToValueAtTime(0.01, t + 0.065);

              osc.connect(gain);
              gain.connect(audioCtx.destination);
              osc.start(t);
              osc.stop(t + 0.07);
            });
          } catch (e) {}
        }

        function playDogCatchJingle() {
          if (isMuted || !audioCtx) return;
          try {
            const now = audioCtx.currentTime;
            const chords = [
              { f: 523.25, d: 0.1 }, // C5
              { f: 659.25, d: 0.1 }, // E5
              { f: 783.99, d: 0.1 }, // G5
              { f: 1046.50, d: 0.28 } // C6
            ];
            let time = now;
            chords.forEach((c) => {
              const osc = audioCtx.createOscillator();
              const gain = audioCtx.createGain();
              osc.type = 'square';
              osc.frequency.setValueAtTime(c.f, time);

              gain.gain.setValueAtTime(0.25, time);
              gain.gain.exponentialRampToValueAtTime(0.01, time + c.d);

              osc.connect(gain);
              gain.connect(audioCtx.destination);
              osc.start(time);
              osc.stop(time + c.d + 0.02);
              time += c.d;
            });
          } catch (e) {}
        }

        function playRoundStartJingle() {
          if (isMuted || !audioCtx) return;
          try {
            const now = audioCtx.currentTime;
            // Classic retro opening fanfare
            const notes = [
              { f: 392.00, d: 0.12 }, // G4
              { f: 523.25, d: 0.12 }, // C5
              { f: 659.25, d: 0.12 }, // E5
              { f: 783.99, d: 0.20 }, // G5
              { f: 659.25, d: 0.12 }, // E5
              { f: 783.99, d: 0.35 }  // G5
            ];
            let time = now;
            notes.forEach((n) => {
              const osc = audioCtx.createOscillator();
              const bass = audioCtx.createOscillator();
              const gain = audioCtx.createGain();

              osc.type = 'square';
              osc.frequency.setValueAtTime(n.f, time);

              bass.type = 'triangle';
              bass.frequency.setValueAtTime(n.f / 2, time);

              gain.gain.setValueAtTime(0.22, time);
              gain.gain.exponentialRampToValueAtTime(0.01, time + n.d);

              osc.connect(gain);
              bass.connect(gain);
              gain.connect(audioCtx.destination);

              osc.start(time);
              bass.start(time);
              osc.stop(time + n.d + 0.02);
              bass.stop(time + n.d + 0.02);
              time += n.d * 1.05;
            });
          } catch (e) {}
        }

        function playGameOverJingle() {
          if (isMuted || !audioCtx) return;
          try {
            const now = audioCtx.currentTime;
            const notes = [
              { f: 587.33, d: 0.18 }, // D5
              { f: 523.25, d: 0.18 }, // C5
              { f: 466.16, d: 0.18 }, // Bb4
              { f: 440.00, d: 0.25 }, // A4
              { f: 349.23, d: 0.5 }   // F4
            ];
            let time = now;
            notes.forEach((n) => {
              const osc = audioCtx.createOscillator();
              const gain = audioCtx.createGain();
              osc.type = 'square';
              osc.frequency.setValueAtTime(n.f, time);

              gain.gain.setValueAtTime(0.25, time);
              gain.gain.exponentialRampToValueAtTime(0.01, time + n.d);

              osc.connect(gain);
              gain.connect(audioCtx.destination);
              osc.start(time);
              osc.stop(time + n.d + 0.02);
              time += n.d * 1.1;
            });
          } catch (e) {}
        }

        function playRoundClearJingle() {
          if (isMuted || !audioCtx) return;
          try {
            const now = audioCtx.currentTime;
            const notes = [
              { f: 523.25, d: 0.1 },
              { f: 587.33, d: 0.1 },
              { f: 659.25, d: 0.1 },
              { f: 783.99, d: 0.14 },
              { f: 880.00, d: 0.14 },
              { f: 1046.50, d: 0.35 }
            ];
            let time = now;
            notes.forEach((n) => {
              const osc = audioCtx.createOscillator();
              const gain = audioCtx.createGain();
              osc.type = 'square';
              osc.frequency.setValueAtTime(n.f, time);

              gain.gain.setValueAtTime(0.22, time);
              gain.gain.exponentialRampToValueAtTime(0.01, time + n.d);

              osc.connect(gain);
              gain.connect(audioCtx.destination);
              osc.start(time);
              osc.stop(time + n.d + 0.02);
              time += n.d;
            });
          } catch (e) {}
        }


        // --- GAME ENGINE SETUP ---
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        ctx.imageSmoothingEnabled = false;

        const GAME_WIDTH = 800;
        const GAME_HEIGHT = 600;
        const GROUND_Y = 460; // Grass line top

        // State Machine
        const STATE = {
          START_SCREEN: 'START_SCREEN',
          ROUND_INTRO: 'ROUND_INTRO',
          SPAWN_WAVE: 'SPAWN_WAVE',
          PLAYING: 'PLAYING',
          FLY_AWAY: 'FLY_AWAY',
          WAVE_END: 'WAVE_END',
          ROUND_SUMMARY: 'ROUND_SUMMARY',
          GAME_OVER: 'GAME_OVER',
          PAUSED: 'PAUSED'
        };

        let currentState = STATE.START_SCREEN;
        let previousState = STATE.START_SCREEN;

        // Game Configuration & Statistics
        let gameMode = 'B'; // 'A' = 1 Duck, 'B' = 2 Ducks
        let currentRound = 1;
        let score = 0;
        let highScore = parseInt(localStorage.getItem('duckhunt_highscore') || '12000', 10);
        let ammo = 3;
        let maxAmmo = 3;
        let totalDucksInRound = 10;
        let waveIndex = 0; // 0 to 4 (or 0 to 9 if 1 duck)
        let roundHitResults = []; // Array of boolean or null (10 items)
        let roundDucksHitCount = 0;
        let requiredHits = 6;

        // Visual FX
        let flashFrames = 0;
        let screenShake = 0;
        let floatingTexts = []; // { text, x, y, life, maxLife, color }

        // Reticle / Cursor position
        let reticleX = 400;
        let reticleY = 300;
        let isCursorInside = true;
        let isMouseDown = false;
        let muzzleFlashTimer = 0;

        // Ducks list
        let ducks = [];

        // Dog entity
        const dog = {
          x: 0,
          y: GROUND_Y,
          state: 'IDLE', // 'WALK', 'SNIFF', 'ALERT', 'JUMP', 'POPUP_CAUGHT', 'POPUP_LAUGH', 'HIDDEN'
          frameTimer: 0,
          walkFrame: 0,
          sniffTimer: 0,
          targetY: GROUND_Y,
          caughtCount: 1,
          laughBounces: 0,
          isShotEasterEgg: false
        };

        // Clouds background
        const clouds = [
          { x: 50, y: 70, w: 120, h: 40, speed: 0.15 },
          { x: 300, y: 110, w: 160, h: 46, speed: 0.22 },
          { x: 620, y: 80, w: 140, h: 42, speed: 0.18 }
        ];

        // Wave Timer
        let waveTimer = 0;
        const WAVE_MAX_TIME = 420; // ~7 seconds at 60 FPS

        // Round Intro sequence timer
        let introTimer = 0;
        let waveEndTimer = 0;

        // --- HELPER FUNCTIONS ---
        function getRequiredHits(round) {
          if (round === 1) return 6;
          if (round === 2) return 7;
          if (round === 3) return 8;
          return 9; // Round 4 and beyond requires 9 hits
        }

        function resetRoundStats() {
          roundHitResults = new Array(totalDucksInRound).fill(null);
          roundDucksHitCount = 0;
          waveIndex = 0;
          requiredHits = getRequiredHits(currentRound);
        }

        function addFloatingText(text, x, y, color = '#ffffff') {
          floatingTexts.push({
            text,
            x,
            y,
            life: 60,
            maxLife: 60,
            color
          });
        }

        // --- DUCK FACTORY ---
        function createDuck(indexInWave) {
          const typeRoll = Math.random();
          let type = 'MALLARD'; // Green head
          let baseSpeed = 3.5 + Math.min(currentRound * 0.45, 6.0);
          let points = 500;

          if (typeRoll > 0.65) {
            type = 'RED'; // Faster red duck
            baseSpeed *= 1.25;
            points = 1000;
          } else if (typeRoll > 0.45 && currentRound >= 3) {
            type = 'BLUE'; // Rare quick blue duck
            baseSpeed *= 1.4;
            points = 1500;
          }

          // Random horizontal spawn position
          const spawnX = 180 + Math.random() * 440;
          const spawnY = GROUND_Y + 10;

          // Initial velocity directed upward and left or right
          const angle = (Math.random() * 0.5 + 0.25) * Math.PI; // angled up
          const dir = (indexInWave % 2 === 0) ? (Math.random() > 0.5 ? 1 : -1) : (Math.random() > 0.5 ? -1 : 1);
          const vx = Math.cos(angle) * baseSpeed * dir;
          const vy = -Math.abs(Math.sin(angle) * baseSpeed);

          return {
            id: Math.random(),
            type,
            points,
            x: spawnX,
            y: spawnY,
            vx,
            vy,
            baseSpeed,
            width: 58,
            height: 52,
            state: 'FLYING', // 'FLYING', 'HIT', 'FALLING', 'FLY_AWAY', 'DEAD'
            wingFrame: 0,
            wingTimer: 0,
            hitTimer: 0,
            directionChangeTimer: Math.floor(Math.random() * 60) + 40,
            facing: vx > 0 ? 1 : -1,
            quackTimer: Math.floor(Math.random() * 120) + 30
          };
        }

        // --- DUCK DRAWING WITH RETRO PIXEL DETAILS ---
        function drawDuck(d) {
          ctx.save();
          ctx.translate(d.x, d.y);

          // If falling, rotate or flip
          if (d.state === 'FALLING') {
            ctx.scale(d.facing, 1);
          } else {
            ctx.scale(d.facing, 1);
          }

          const isShocked = (d.state === 'HIT' && Math.floor(d.hitTimer / 4) % 2 === 0);

          // Colors by Duck Type
          let headColor = '#00aa00'; // emerald green
          let bodyColor = '#884400'; // rich brown
          let wingColor = '#552200';
          let wingAccent = '#0055ff'; // blue speculum
          let billColor = '#ffbb00';

          if (d.type === 'RED') {
            headColor = '#dd2200';
            bodyColor = '#991100';
            wingColor = '#660000';
            wingAccent = '#ff8800';
            billColor = '#ffdd00';
          } else if (d.type === 'BLUE') {
            headColor = '#00bbdd';
            bodyColor = '#223344';
            wingColor = '#112233';
            wingAccent = '#55ffff';
            billColor = '#ffaa00';
          }

          if (isShocked) {
            // Flash white/yellow during hit frame
            headColor = '#ffffff';
            bodyColor = '#ffffff';
            wingColor = '#ffff55';
            wingAccent = '#ffffff';
            billColor = '#ff5555';
          }

          if (d.state === 'HIT') {
            // Iconic Shocked Hit Frame: splayed wings, wide eye, open beak
            // Body
            ctx.fillStyle = bodyColor;
            ctx.fillRect(-16, -10, 32, 22);

            // Neck ring
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(-6, -14, 18, 4);

            // Head
            ctx.fillStyle = headColor;
            ctx.fillRect(-4, -28, 22, 16);

            // Open Beak
            ctx.fillStyle = billColor;
            ctx.fillRect(18, -26, 12, 5);
            ctx.fillRect(18, -19, 10, 4);
            ctx.fillStyle = '#000000';
            ctx.fillRect(18, -21, 8, 2);

            // Shocked Eye (X or wide circle)
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(6, -26, 8, 8);
            ctx.fillStyle = '#000000';
            ctx.fillRect(9, -24, 3, 4);

            // Splayed Wings (Hit pose)
            ctx.fillStyle = wingColor;
            ctx.fillRect(-26, -26, 14, 28);
            ctx.fillRect(-32, -18, 8, 16);
            ctx.fillStyle = wingAccent;
            ctx.fillRect(-22, -22, 6, 14);

            // Tail
            ctx.fillStyle = '#222222';
            ctx.fillRect(-22, 0, 8, 8);
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(-20, -4, 6, 4);

          } else if (d.state === 'FALLING') {
            // Spinning / plummeting vertically
            ctx.save();
            ctx.rotate(Math.PI / 2); // vertical drop

            // Body
            ctx.fillStyle = bodyColor;
            ctx.fillRect(-16, -10, 30, 20);

            // White belly
            ctx.fillStyle = '#dddddd';
            ctx.fillRect(-12, 2, 22, 8);

            // Neck collar & Head
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(-4, -14, 16, 4);
            ctx.fillStyle = headColor;
            ctx.fillRect(-2, -26, 18, 14);

            // Bill
            ctx.fillStyle = billColor;
            ctx.fillRect(16, -22, 10, 6);

            // Closed Eye (Hit)
            ctx.fillStyle = '#000000';
            ctx.fillRect(6, -22, 6, 2);

            // Drooping Wing
            ctx.fillStyle = wingColor;
            ctx.fillRect(-18, -8, 20, 10);
            ctx.fillStyle = wingAccent;
            ctx.fillRect(-12, -4, 10, 4);

            ctx.restore();

          } else {
            // FLYING or FLY_AWAY
            // 3-Frame wing cycle (0 = Down, 1 = Mid, 2 = Up)
            const wf = d.wingFrame;

            // Tail Feathers
            ctx.fillStyle = '#222222';
            ctx.fillRect(-24, -4, 8, 8);
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(-22, -8, 6, 5);

            // Main Body
            ctx.fillStyle = bodyColor;
            ctx.fillRect(-16, -8, 28, 18);

            // Chest
            ctx.fillStyle = '#aa5511';
            ctx.fillRect(4, -4, 8, 12);

            // White Neck Collar
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(8, -14, 6, 10);

            // Green/Red Head
            ctx.fillStyle = headColor;
            ctx.fillRect(10, -22, 18, 14);

            // Eye
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(18, -20, 5, 5);
            ctx.fillStyle = '#000000';
            ctx.fillRect(20, -19, 2, 3);

            // Beak
            ctx.fillStyle = billColor;
            ctx.fillRect(28, -18, 10, 6);

            // Legs / Feet tucked
            ctx.fillStyle = '#ff8800';
            ctx.fillRect(-6, 10, 8, 4);

            // Animated Wings
            ctx.fillStyle = wingColor;
            if (wf === 0) {
              // Wing Down
              ctx.fillRect(-14, 2, 22, 16);
              ctx.fillRect(-8, 18, 12, 6);
              ctx.fillStyle = wingAccent;
              ctx.fillRect(-10, 6, 14, 6);
            } else if (wf === 1) {
              // Wing Mid (Horizontal)
              ctx.fillRect(-18, -6, 26, 10);
              ctx.fillRect(-24, -4, 8, 6);
              ctx.fillStyle = wingAccent;
              ctx.fillRect(-14, -4, 14, 5);
            } else {
              // Wing Up
              ctx.fillRect(-14, -26, 18, 20);
              ctx.fillRect(-8, -32, 10, 8);
              ctx.fillStyle = wingAccent;
              ctx.fillRect(-10, -20, 10, 8);
            }
          }

          ctx.restore();
        }

        // --- DOG DRAWING WITH RETRO PIXEL DETAILS ---
        function drawDog() {
          if (dog.state === 'HIDDEN') return;

          ctx.save();
          ctx.translate(dog.x, dog.y);

          const dogBrown = '#a0522d';
          const dogDark = '#6b3410';
          const dogLight = '#d29668';
          const dogWhite = '#ffffff';
          const dogNose = '#111111';

          if (dog.state === 'WALK' || dog.state === 'SNIFF') {
            // Dog walking across the field
            const legOffset = (dog.walkFrame % 2 === 0) ? 6 : -6;

            // Tail wagging
            ctx.fillStyle = dogBrown;
            ctx.fillRect(-22, -18 + (dog.walkFrame % 2 === 0 ? -4 : 2), 6, 16);

            // Body
            ctx.fillRect(-16, -14, 38, 22);

            // Legs
            ctx.fillStyle = dogDark;
            ctx.fillRect(-12 + legOffset, 8, 6, 16);
            ctx.fillRect(12 - legOffset, 8, 6, 16);
            ctx.fillStyle = dogBrown;
            ctx.fillRect(-12 - legOffset, 8, 6, 16);
            ctx.fillRect(12 + legOffset, 8, 6, 16);

            // White Paws
            ctx.fillStyle = dogWhite;
            ctx.fillRect(-12 + legOffset, 20, 8, 4);
            ctx.fillRect(12 - legOffset, 20, 8, 4);
            ctx.fillRect(-12 - legOffset, 20, 8, 4);
            ctx.fillRect(12 + legOffset, 20, 8, 4);

            // Head & Snout
            if (dog.state === 'SNIFF') {
              // Snout lowered to ground
              ctx.fillStyle = dogBrown;
              ctx.fillRect(20, -6, 20, 18);
              ctx.fillStyle = dogLight;
              ctx.fillRect(28, 0, 16, 14);
              ctx.fillStyle = dogNose;
              ctx.fillRect(42, 6, 6, 6);
              // Drooping Ear
              ctx.fillStyle = dogDark;
              ctx.fillRect(18, -4, 10, 18);
            } else {
              // Normal Head
              ctx.fillStyle = dogBrown;
              ctx.fillRect(20, -22, 22, 20);
              ctx.fillStyle = dogLight;
              ctx.fillRect(28, -14, 18, 14);
              ctx.fillStyle = dogNose;
              ctx.fillRect(44, -14, 6, 6);
              // Floppy Ear
              ctx.fillStyle = dogDark;
              ctx.fillRect(18, -20, 10, 20);
              // Eye
              ctx.fillStyle = '#000000';
              ctx.fillRect(28, -18, 4, 4);
            }

            // Red Collar
            ctx.fillStyle = '#dd1111';
            ctx.fillRect(18, -6, 6, 14);

          } else if (dog.state === 'ALERT') {
            // Dog perked up with exclamation mark
            ctx.fillStyle = dogBrown;
            ctx.fillRect(-16, -14, 34, 24);

            // Legs planted
            ctx.fillRect(-12, 10, 6, 14);
            ctx.fillRect(10, 10, 6, 14);

            // Head upright facing viewer slightly
            ctx.fillRect(14, -28, 24, 24);
            ctx.fillStyle = dogLight;
            ctx.fillRect(20, -18, 18, 14);
            ctx.fillStyle = dogNose;
            ctx.fillRect(36, -18, 6, 6);
            ctx.fillStyle = dogDark;
            ctx.fillRect(12, -26, 8, 22);

            // Alert Eye
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(24, -24, 6, 6);
            ctx.fillStyle = '#000000';
            ctx.fillRect(26, -23, 3, 4);

            // Red Collar
            ctx.fillStyle = '#dd1111';
            ctx.fillRect(14, -10, 6, 14);

            // Pixel Exclamation Mark above head!
            ctx.fillStyle = '#55ffff';
            ctx.fillRect(22, -48, 8, 12);
            ctx.fillRect(22, -32, 8, 6);
            ctx.fillStyle = '#0000aa';
            ctx.strokeRect(21, -49, 10, 14);
            ctx.strokeRect(21, -33, 10, 8);

          } else if (dog.state === 'JUMP') {
            // Dog leaping over grass into the bushes
            ctx.fillStyle = dogBrown;
            ctx.fillRect(-20, -10, 42, 20);

            // Splayed leaping legs
            ctx.fillRect(-28, 0, 12, 8);
            ctx.fillRect(18, 0, 14, 8);

            // Upright cheerful head
            ctx.fillRect(14, -26, 22, 22);
            ctx.fillStyle = dogLight;
            ctx.fillRect(22, -18, 16, 14);
            ctx.fillStyle = dogNose;
            ctx.fillRect(36, -18, 6, 6);
            ctx.fillStyle = dogDark;
            ctx.fillRect(10, -22, 8, 18);

            // Eye
            ctx.fillStyle = '#000000';
            ctx.fillRect(22, -22, 4, 4);

          } else if (dog.state === 'POPUP_CAUGHT') {
            // Dog holding 1 or 2 ducks proudly!
            // Torso emerging from behind the grass
            ctx.fillStyle = dogBrown;
            ctx.fillRect(-24, -20, 48, 50);

            // Chest patch
            ctx.fillStyle = dogLight;
            ctx.fillRect(-12, -6, 24, 36);

            // Happy Smiling Face
            ctx.fillStyle = dogBrown;
            ctx.fillRect(-20, -56, 40, 36);

            // Muzzle
            ctx.fillStyle = dogLight;
            ctx.fillRect(-14, -36, 28, 20);
            ctx.fillStyle = dogNose;
            ctx.fillRect(-5, -36, 10, 8);

            // Big Happy Smile
            ctx.fillStyle = '#000000';
            ctx.fillRect(-8, -24, 16, 3);
            ctx.fillRect(-10, -26, 3, 3);
            ctx.fillRect(7, -26, 3, 3);

            // Happy Closed Eyes (arc ^ ^)
            ctx.fillStyle = '#000000';
            ctx.fillRect(-15, -46, 8, 3);
            ctx.fillRect(-13, -48, 4, 3);
            ctx.fillRect(7, -46, 8, 3);
            ctx.fillRect(9, -48, 4, 3);

            // Floppy Ears
            ctx.fillStyle = dogDark;
            ctx.fillRect(-30, -52, 12, 32);
            ctx.fillRect(18, -52, 12, 32);

            // Red Collar
            ctx.fillStyle = '#dd1111';
            ctx.fillRect(-18, -22, 36, 6);

            // Captured Duck(s) in paws!
            if (dog.caughtCount >= 1) {
              // Left hand holding Mallard duck by neck
              ctx.fillStyle = '#00aa00'; // Green head
              ctx.fillRect(-44, -38, 16, 14);
              ctx.fillStyle = '#ffbb00'; // Beak
              ctx.fillRect(-52, -34, 8, 6);
              ctx.fillStyle = '#ffffff'; // Neck ring
              ctx.fillRect(-38, -26, 10, 4);
              ctx.fillStyle = '#884400'; // Body
              ctx.fillRect(-46, -22, 20, 22);

              // Dog Paw holding it
              ctx.fillStyle = dogWhite;
              ctx.fillRect(-34, -28, 10, 10);
            }

            if (dog.caughtCount >= 2) {
              // Right hand holding Red duck by neck
              ctx.fillStyle = '#dd2200'; // Red head
              ctx.fillRect(28, -38, 16, 14);
              ctx.fillStyle = '#ffdd00'; // Beak
              ctx.fillRect(44, -34, 8, 6);
              ctx.fillStyle = '#ffffff'; // Neck
              ctx.fillRect(28, -26, 10, 4);
              ctx.fillStyle = '#991100'; // Body
              ctx.fillRect(26, -22, 20, 22);

              // Dog Paw holding it
              ctx.fillStyle = dogWhite;
              ctx.fillRect(24, -28, 10, 10);
            }

          } else if (dog.state === 'POPUP_LAUGH') {
            // Iconic Laughing / Snickering Dog!
            // Shoulder bounce animation
            const bounceY = (Math.floor(dog.laughBounces / 4) % 2 === 0) ? -4 : 0;

            ctx.translate(0, bounceY);

            // Torso
            ctx.fillStyle = dogBrown;
            ctx.fillRect(-22, -16, 44, 46);
            ctx.fillStyle = dogLight;
            ctx.fillRect(-10, -4, 20, 32);

            // Head
            ctx.fillStyle = dogBrown;
            ctx.fillRect(-20, -52, 40, 36);

            // Floppy bouncing ears
            ctx.fillStyle = dogDark;
            const earBounce = bounceY * 1.5;
            ctx.fillRect(-32, -50 + earBounce, 14, 30);
            ctx.fillRect(18, -50 + earBounce, 14, 30);

            // Muzzle
            ctx.fillStyle = dogLight;
            ctx.fillRect(-14, -34, 28, 20);
            ctx.fillStyle = dogNose;
            ctx.fillRect(-5, -34, 10, 8);

            // Giggling Mouth (Paws covering or chuckling)
            ctx.fillStyle = '#000000';
            ctx.fillRect(-10, -22, 20, 8);
            ctx.fillStyle = '#ff4444'; // Tongue
            ctx.fillRect(-6, -18, 12, 4);

            // Shut, laughing eyes
            ctx.fillStyle = '#000000';
            ctx.fillRect(-15, -42, 8, 3);
            ctx.fillRect(-15, -45, 3, 3);
            ctx.fillRect(-10, -45, 3, 3);
            ctx.fillRect(7, -42, 8, 3);
            ctx.fillRect(7, -45, 3, 3);
            ctx.fillRect(12, -45, 3, 3);

            // Front Paws held up to muzzle laughing!
            ctx.fillStyle = dogWhite;
            ctx.fillRect(-14, -22, 10, 12);
            ctx.fillRect(4, -22, 10, 12);

            // Red Collar
            ctx.fillStyle = '#dd1111';
            ctx.fillRect(-18, -18, 36, 5);

            // Easter Egg: If shot during laughing (VS Duck Hunt arcade style)
            if (dog.isShotEasterEgg) {
              ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
              ctx.fillRect(-20, -54, 40, 42);
              // Bandage
              ctx.fillStyle = '#ffffff';
              ctx.fillRect(-8, -44, 16, 6);
            }
          }

          ctx.restore();
        }

        // --- SCENERY & BACKGROUND DRAWING ---
        function drawBackground() {
          // Dynamic Sky Gradient
          let skyTop = '#5c94fc';
          let skyBottom = '#98b8fc';

          if (currentState === STATE.FLY_AWAY) {
            // Peach / alert pink sky during Fly Away
            skyTop = '#fc7460';
            skyBottom = '#fca090';
          } else if (currentRound >= 5) {
            // Sunset sky in later rounds
            skyTop = '#4477dd';
            skyBottom = '#88aaff';
          }

          const skyGrad = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
          skyGrad.addColorStop(0, skyTop);
          skyGrad.addColorStop(1, skyBottom);
          ctx.fillStyle = skyGrad;
          ctx.fillRect(0, 0, GAME_WIDTH, GROUND_Y);

          // Moving Retro Pixel Clouds
          ctx.fillStyle = '#ffffff';
          clouds.forEach((c) => {
            // Blocky rounded clouds
            ctx.fillRect(c.x + 16, c.y, c.w - 32, c.h);
            ctx.fillRect(c.x, c.y + 10, c.w, c.h - 14);
            ctx.fillRect(c.x + 28, c.y - 12, c.w - 60, 16);
            // Cloud shadow tint
            ctx.fillStyle = '#d8e4f8';
            ctx.fillRect(c.x + 10, c.y + c.h - 6, c.w - 20, 6);
            ctx.fillStyle = '#ffffff';
          });

          // Distant Green Mountain Peaks
          ctx.fillStyle = '#5c9c38';
          ctx.beginPath();
          ctx.moveTo(0, GROUND_Y - 40);
          ctx.lineTo(140, GROUND_Y - 110);
          ctx.lineTo(260, GROUND_Y - 40);
          ctx.lineTo(440, GROUND_Y - 130);
          ctx.lineTo(600, GROUND_Y - 50);
          ctx.lineTo(720, GROUND_Y - 100);
          ctx.lineTo(GAME_WIDTH, GROUND_Y - 40);
          ctx.lineTo(GAME_WIDTH, GROUND_Y);
          ctx.lineTo(0, GROUND_Y);
          ctx.fill();

          // Mountain highlights
          ctx.fillStyle = '#74b448';
          ctx.beginPath();
          ctx.moveTo(140, GROUND_Y - 110);
          ctx.lineTo(190, GROUND_Y - 70);
          ctx.lineTo(140, GROUND_Y - 40);
          ctx.fill();

          ctx.beginPath();
          ctx.moveTo(440, GROUND_Y - 130);
          ctx.lineTo(510, GROUND_Y - 80);
          ctx.lineTo(440, GROUND_Y - 50);
          ctx.fill();

          // Iconic Gnarled Tree on Left
          drawRetroTree(80, GROUND_Y);

          // Retro Bush on Right
          drawRetroBush(660, GROUND_Y);
        }

        function drawRetroTree(x, baseY) {
          ctx.save();
          // Trunk
          ctx.fillStyle = '#884411';
          ctx.fillRect(x - 22, baseY - 240, 44, 240);
          ctx.fillRect(x - 30, baseY - 60, 60, 60);
          ctx.fillRect(x - 40, baseY - 20, 80, 20);

          // Bark texture
          ctx.fillStyle = '#552200';
          ctx.fillRect(x - 14, baseY - 200, 10, 160);
          ctx.fillRect(x + 6, baseY - 160, 8, 120);

          // Branches
          ctx.fillStyle = '#884411';
          ctx.fillRect(x - 60, baseY - 260, 50, 26);
          ctx.fillRect(x + 10, baseY - 280, 60, 28);

          // Foliage Clusters
          const leavesLight = '#44aa00';
          const leavesMid = '#2e8b00';
          const leavesDark = '#1b5e00';

          function drawFoliageCluster(cx, cy, r) {
            ctx.fillStyle = leavesDark;
            ctx.beginPath();
            ctx.arc(cx, cy, r, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = leavesMid;
            ctx.beginPath();
            ctx.arc(cx - r * 0.15, cy - r * 0.15, r * 0.85, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = leavesLight;
            ctx.beginPath();
            ctx.arc(cx - r * 0.35, cy - r * 0.35, r * 0.55, 0, Math.PI * 2);
            ctx.fill();
          }

          drawFoliageCluster(x - 50, baseY - 290, 60);
          drawFoliageCluster(x + 50, baseY - 310, 65);
          drawFoliageCluster(x, baseY - 350, 75);
          drawFoliageCluster(x - 20, baseY - 270, 50);

          ctx.restore();
        }

        function drawRetroBush(x, baseY) {
          ctx.save();
          const leavesLight = '#55bb00';
          const leavesMid = '#389400';
          const leavesDark = '#1e6600';

          function drawBushBubble(bx, by, w, h) {
            ctx.fillStyle = leavesDark;
            ctx.fillRect(bx - w / 2, by - h, w, h);
            ctx.fillStyle = leavesMid;
            ctx.fillRect(bx - w / 2 + 4, by - h + 4, w - 8, h - 8);
            ctx.fillStyle = leavesLight;
            ctx.fillRect(bx - w / 2 + 8, by - h + 6, w / 2, h / 2);
          }

          drawBushBubble(x - 30, baseY, 60, 50);
          drawBushBubble(x + 30, baseY, 70, 60);
          drawBushBubble(x, baseY, 80, 75);
          ctx.restore();
        }

        // Foreground Grass (renders in front of fallen ducks and rising dog)
        function drawForegroundGrass() {
          // Mid ground grass bank
          ctx.fillStyle = '#449c00';
          ctx.fillRect(0, GROUND_Y - 14, GAME_WIDTH, 34);

          // Top jagged pixel tufts
          ctx.fillStyle = '#68cc00';
          for (let i = 0; i < GAME_WIDTH; i += 16) {
            ctx.fillRect(i, GROUND_Y - 20, 8, 8);
            ctx.fillRect(i + 8, GROUND_Y - 16, 8, 6);
          }

          // Main vibrant grass strip
          ctx.fillStyle = '#60b800';
          ctx.fillRect(0, GROUND_Y + 12, GAME_WIDTH, 48);

          // Base dirt / turf layer
          ctx.fillStyle = '#9c5c24';
          ctx.fillRect(0, GROUND_Y + 54, GAME_WIDTH, 14);

          ctx.fillStyle = '#6b3c10';
          ctx.fillRect(0, GROUND_Y + 68, GAME_WIDTH, 8);
        }

        // --- RETRO BOTTOM HUD (AUTHENTIC NES STATUS BAR) ---
        function drawHUD() {
          const hudY = 530;
          const hudHeight = 70;

          // Black arcade frame
          ctx.fillStyle = '#000000';
          ctx.fillRect(0, hudY, GAME_WIDTH, hudHeight);
          ctx.strokeStyle = '#222633';
          ctx.lineWidth = 2;
          ctx.strokeRect(0, hudY, GAME_WIDTH, hudHeight);

          // 1. LEFT: SHOT COUNTER & AMMO
          ctx.fillStyle = '#64d824'; // NES bright green text
          ctx.font = '14px "PressStart2P", monospace';
          ctx.fillText('SHOT', 40, hudY + 28);

          // Bullet shells display
          const bulletSpacing = 22;
          for (let b = 0; b < maxAmmo; b++) {
            const bx = 42 + b * bulletSpacing;
            const by = hudY + 38;

            if (b < ammo) {
              // Active brass bullet shell
              ctx.fillStyle = '#f8b800';
              ctx.fillRect(bx, by, 10, 18);
              ctx.fillStyle = '#ffffff';
              ctx.fillRect(bx + 2, by + 2, 4, 12);
              ctx.fillStyle = '#b83800';
              ctx.fillRect(bx, by + 14, 10, 4);
            } else {
              // Expended empty shell outline
              ctx.strokeStyle = '#444c5e';
              ctx.lineWidth = 2;
              ctx.strokeRect(bx, by, 10, 18);
            }
          }

          // 2. CENTER: DUCK HIT TALLY (10 ICONS)
          ctx.fillStyle = '#64d824';
          ctx.fillText('HIT', 220, hudY + 28);

          // Target bar below HIT indicator
          ctx.fillStyle = '#ffffff';
          ctx.font = '10px "PressStart2P", monospace';
          ctx.fillText(`REQ: ${requiredHits}`, 220, hudY + 58);

          // 10 Duck hit tally markers
          const tallyStartX = 280;
          const tallySpacing = 26;
          for (let i = 0; i < totalDucksInRound; i++) {
            const tx = tallyStartX + i * tallySpacing;
            const ty = hudY + 22;

            const res = roundHitResults[i];
            const isCurrentTarget = (i >= waveIndex * (gameMode === 'B' ? 2 : 1) && 
                                     i < (waveIndex + 1) * (gameMode === 'B' ? 2 : 1) &&
                                     (currentState === STATE.PLAYING || currentState === STATE.SPAWN_WAVE));

            if (res === true) {
              // Hit Duck: Solid bright red duck icon
              ctx.fillStyle = '#e52521';
              drawTallyDuck(tx, ty, true);
            } else if (res === false) {
              // Missed Duck: Hollow dark outline
              ctx.fillStyle = '#444b60';
              drawTallyDuck(tx, ty, false);
            } else if (isCurrentTarget) {
              // Active target: Blinking neon duck
              if (Math.floor(Date.now() / 150) % 2 === 0) {
                ctx.fillStyle = '#64d824';
                drawTallyDuck(tx, ty, true);
              } else {
                ctx.fillStyle = '#ffffff';
                drawTallyDuck(tx, ty, false);
              }
            } else {
              // Unplayed duck: White outline
              ctx.fillStyle = '#9aa5be';
              drawTallyDuck(tx, ty, false);
            }
          }

          // 3. RIGHT: SCORE & ROUND
          ctx.fillStyle = '#64d824';
          ctx.font = '14px "PressStart2P", monospace';
          ctx.fillText('SCORE', 610, hudY + 26);

          // 6-digit score format
          ctx.fillStyle = '#ffffff';
          const scoreStr = score.toString().padStart(6, '0');
          ctx.fillText(scoreStr, 610, hudY + 46);

          // Round indicator
          ctx.fillStyle = '#64d824';
          ctx.fillText(`R=${currentRound}`, 710, hudY + 26);
        }

        function drawTallyDuck(x, y, filled) {
          // Pixel silhouette of duck for tally
          if (filled) {
            ctx.fillRect(x + 4, y, 6, 4);   // head
            ctx.fillRect(x + 10, y + 2, 3, 2); // beak
            ctx.fillRect(x, y + 4, 10, 6);  // body
            ctx.fillRect(x - 3, y + 6, 3, 3); // tail
          } else {
            ctx.fillRect(x + 4, y, 6, 2);
            ctx.fillRect(x + 8, y + 2, 2, 4);
            ctx.fillRect(x, y + 8, 10, 2);
            ctx.fillRect(x, y + 4, 2, 6);
            ctx.fillRect(x - 2, y + 6, 2, 2);
          }
        }

        // --- RETICLE / CROSSHAIR RENDERING ---
        function drawReticle() {
          if (!isCursorInside && currentState !== STATE.START_SCREEN) return;

          ctx.save();
          const rx = reticleX;
          const ry = reticleY;

          // Muzzle flash ring if just fired
          if (muzzleFlashTimer > 0) {
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.arc(rx, ry, 34, 0, Math.PI * 2);
            ctx.stroke();

            ctx.fillStyle = 'rgba(255, 255, 200, 0.4)';
            ctx.beginPath();
            ctx.arc(rx, ry, 26, 0, Math.PI * 2);
            ctx.fill();
          }

          // Outer reticle circle
          ctx.strokeStyle = '#ff2222';
          ctx.lineWidth = 2.5;
          ctx.beginPath();
          ctx.arc(rx, ry, 18, 0, Math.PI * 2);
          ctx.stroke();

          // Crosshairs with gap in center
          ctx.strokeStyle = '#ff2222';
          ctx.lineWidth = 2;
          ctx.beginPath();
          // Top
          ctx.moveTo(rx, ry - 28);
          ctx.lineTo(rx, ry - 7);
          // Bottom
          ctx.moveTo(rx, ry + 7);
          ctx.lineTo(rx, ry + 28);
          // Left
          ctx.moveTo(rx - 28, ry);
          ctx.lineTo(rx - 7, ry);
          // Right
          ctx.moveTo(rx + 7, ry);
          ctx.lineTo(rx + 28, ry);
          ctx.stroke();

          // Center precision dot
          ctx.fillStyle = '#ffff00';

        // --- GAME ACTIONS & STATE TRANSITIONS ---
        function startGame() {
          initAudio();
          currentRound = 1;
          score = 0;
          resetRoundStats();
          startRoundIntro();
        }

        function startRoundIntro() {
          currentState = STATE.ROUND_INTRO;
          introTimer = 0;
          dog.state = 'WALK';
          dog.x = -40;
          dog.y = GROUND_Y;
          dog.walkFrame = 0;
          dog.isShotEasterEgg = false;
          playRoundStartJingle();
        }

        function spawnWave() {
          currentState = STATE.PLAYING;
          ammo = maxAmmo;
          waveTimer = 0;
          ducks = [];

          const numDucks = (gameMode === 'B') ? 2 : 1;
          for (let i = 0; i < numDucks; i++) {
            ducks.push(createDuck(i));
          }

          playQuack();
        }

        function triggerFlyAway() {
          currentState = STATE.FLY_AWAY;
          let anyFlew = false;

          ducks.forEach((d) => {
            if (d.state === 'FLYING') {
              d.state = 'FLY_AWAY';
              d.vy = -7.5; // fly straight up at high speed
              d.vx = 0;
              anyFlew = true;
            }
          });

          // Record misses in round results
          const ducksPerWave = (gameMode === 'B') ? 2 : 1;
          const startIndex = waveIndex * ducksPerWave;
          ducks.forEach((d, idx) => {
            const globalIndex = startIndex + idx;
            if (roundHitResults[globalIndex] === null) {
              roundHitResults[globalIndex] = false;
            }
          });
        }

        function endWave() {
          currentState = STATE.WAVE_END;
          waveEndTimer = 0;

          // Count how many ducks were hit in this wave
          const ducksHitThisWave = ducks.filter(d => d.state === 'DEAD').length;

          if (ducksHitThisWave > 0) {
            // Dog pops up proudly with captured ducks
            dog.state = 'POPUP_CAUGHT';
            dog.caughtCount = ducksHitThisWave;
            dog.x = (ducks[0] ? ducks[0].x : 400);
            dog.x = Math.max(120, Math.min(680, dog.x));
            dog.y = GROUND_Y + 50;
            dog.targetY = GROUND_Y - 14;
            playDogCatchJingle();
          } else {
            // All escaped: Dog pops up laughing!
            dog.state = 'POPUP_LAUGH';
            dog.laughBounces = 0;
            dog.x = 400;
            dog.y = GROUND_Y + 50;
            dog.targetY = GROUND_Y - 14;
            playDogLaugh();
          }
        }

        function advanceToNextWaveOrRound() {
          waveIndex++;
          const maxWaves = (gameMode === 'B') ? 5 : 10;

          if (waveIndex >= maxWaves) {
            // Round finished: evaluate pass/fail
            if (roundDucksHitCount >= requiredHits) {
              // PASSED!
              currentState = STATE.ROUND_SUMMARY;
              waveEndTimer = 0;
              playRoundClearJingle();
            } else {
              // FAILED!
              currentState = STATE.GAME_OVER;
              if (score > highScore) {
                highScore = score;
                localStorage.setItem('duckhunt_highscore', highScore.toString());
              }
              playGameOverJingle();
            }
          } else {
            // Next wave
            spawnWave();
          }
        }

        // --- SHOOTING MECHANIC ---
        function fireShot() {
          initAudio();

          if (currentState === STATE.START_SCREEN) {
            // Check Start Button Click
            if (reticleX >= 260 && reticleX <= 540 && reticleY >= 405 && reticleY <= 465) {
              startGame();
              return;
            }
            // Check Mode A click
            if (reticleX >= 160 && reticleX <= 640 && reticleY >= 265 && reticleY <= 305) {
              gameMode = 'A';
              playEmptyClick();
              return;
            }
            // Check Mode B click
            if (reticleX >= 160 && reticleX <= 640 && reticleY >= 306 && reticleY <= 345) {
              gameMode = 'B';
              playEmptyClick();
              return;
            }
            return;
          }

          if (currentState === STATE.GAME_OVER) {
            // Check Play Again Click
            if (reticleX >= 260 && reticleX <= 540 && reticleY >= 420 && reticleY <= 480) {
              startGame();
              return;
            }
            return;
          }

          if (currentState !== STATE.PLAYING) {
            // Easter egg: shooting laughing dog
            if (dog.state === 'POPUP_LAUGH' && !dog.isShotEasterEgg) {
              const dx = reticleX - dog.x;
              const dy = reticleY - (dog.y - 20);
              if (Math.hypot(dx, dy) < 45) {
                playGunshot();
                dog.isShotEasterEgg = true;
                playDogBark();
                flashFrames = 3;
                screenShake = 6;
                addFloatingText("OUCH!", dog.x, dog.y - 65, '#ff5555');
              }
            }
            return;
          }

          // In PLAYING state
          if (ammo <= 0) {
            playEmptyClick();
            return;
          }

          // Expend 1 ammo
          ammo--;
          playGunshot();
          muzzleFlashTimer = 6;
          flashFrames = 2; // Retro CRT white flash
          screenShake = 5;

          // Check hit collisions with flying ducks
          let hitAny = false;
          ducks.forEach((d, idx) => {
            if (d.state === 'FLYING') {
              // Bounding box with generous hit margin for fast arcade feel
              const hitRadius = 42;
              const dist = Math.hypot(reticleX - d.x, reticleY - d.y);

              if (dist <= hitRadius) {
                // HIT!
                hitAny = true;
                d.state = 'HIT';
                d.hitTimer = 24; // 24 frames of shocked flash before drop
                d.vx = 0;
                d.vy = 0;
                playHit();

                // Calculate Score & Floating indicator
                score += d.points;
                roundDucksHitCount++;
                addFloatingText(`+${d.points}`, d.x, d.y - 25, '#ffea00');

                // Update round results array
                const ducksPerWave = (gameMode === 'B') ? 2 : 1;
                const globalIndex = waveIndex * ducksPerWave + idx;
                roundHitResults[globalIndex] = true;
              }
            }
          });

          // Check if out of ammo with ducks still flying
          const remainingFlying = ducks.filter(d => d.state === 'FLYING').length;
          if (ammo === 0 && remainingFlying > 0) {
            triggerFlyAway();
          }
        }


        // --- UPDATE LOOP ---
        function update() {
          // FX timers
          if (flashFrames > 0) flashFrames--;
          if (screenShake > 0) screenShake *= 0.85;
          if (muzzleFlashTimer > 0) muzzleFlashTimer--;

          // Floating Texts
          for (let i = floatingTexts.length - 1; i >= 0; i--) {
            const ft = floatingTexts[i];
            ft.y -= 0.8;
            ft.life--;
            if (ft.life <= 0) {
              floatingTexts.splice(i, 1);
            }
          }

          // Clouds Drift
          clouds.forEach((c) => {
            c.x += c.speed;
            if (c.x > GAME_WIDTH + 60) {
              c.x = -c.w - 40;
            }
          });

          // State Machine Updates
          if (currentState === STATE.ROUND_INTRO) {
            introTimer++;

            if (dog.state === 'WALK') {
              dog.x += 2.2;
              dog.walkFrame++;
              if (dog.x > 220) {
                dog.state = 'SNIFF';
                dog.sniffTimer = 0;
              }
            } else if (dog.state === 'SNIFF') {
              dog.sniffTimer++;
              if (dog.sniffTimer > 35) {
                dog.state = 'ALERT';
                playDogBark();
                dog.sniffTimer = 0;
              }
            } else if (dog.state === 'ALERT') {
              dog.sniffTimer++;
              if (dog.sniffTimer > 30) {
                dog.state = 'JUMP';
                dog.sniffTimer = 0;
              }
            } else if (dog.state === 'JUMP') {
              dog.sniffTimer++;
              dog.x += 2.5;
              dog.y -= 3.5;
              if (dog.sniffTimer > 28) {
                dog.state = 'HIDDEN';
                dog.y = GROUND_Y;
                spawnWave();
              }
            }

          } else if (currentState === STATE.PLAYING) {
            waveTimer++;

            // Check wave timeout (Fly Away)
            if (waveTimer >= WAVE_MAX_TIME) {
              const remainingFlying = ducks.filter(d => d.state === 'FLYING').length;
              if (remainingFlying > 0) {
                triggerFlyAway();
              }
            }

            // Update Ducks
            let allDeadOrGone = true;

            ducks.forEach((d) => {
              if (d.state === 'FLYING') {
                allDeadOrGone = false;

                // Move
                d.x += d.vx;
                d.y += d.vy;

                // Wing flapping animation
                d.wingTimer++;
                if (d.wingTimer % 6 === 0) {
                  d.wingFrame = (d.wingFrame + 1) % 3;
                  if (d.wingFrame === 0 && Math.random() < 0.3) {
                    playWingFlap();
                  }
                }

                // Random quacking
                d.quackTimer--;
                if (d.quackTimer <= 0) {
                  playQuack();
                  d.quackTimer = Math.floor(Math.random() * 180) + 90;
                }

                // Bouncing off screen bounds (left, right, top, ground)
                if (d.x < 50) {
                  d.x = 50;
                  d.vx = Math.abs(d.vx);
                  d.facing = 1;
                } else if (d.x > GAME_WIDTH - 50) {
                  d.x = GAME_WIDTH - 50;
                  d.vx = -Math.abs(d.vx);
                  d.facing = -1;
                }

                if (d.y < 50) {
                  d.y = 50;
                  d.vy = Math.abs(d.vy);
                } else if (d.y > GROUND_Y - 30) {
                  d.y = GROUND_Y - 30;
                  d.vy = -Math.abs(d.vy);
                }

                // Periodic direction steering
                d.directionChangeTimer--;
                if (d.directionChangeTimer <= 0) {
                  d.directionChangeTimer = Math.floor(Math.random() * 70) + 40;
                  const newAngle = (Math.random() * 0.7 + 0.15) * Math.PI;
                  const dir = Math.random() > 0.5 ? 1 : -1;
                  d.vx = Math.cos(newAngle) * d.baseSpeed * dir;
                  d.vy = -Math.sin(newAngle) * d.baseSpeed;
                  d.facing = d.vx > 0 ? 1 : -1;
                }

              } else if (d.state === 'HIT') {
                allDeadOrGone = false;
                d.hitTimer--;
                if (d.hitTimer <= 0) {
                  d.state = 'FALLING';
                  playFalling();
                }

              } else if (d.state === 'FALLING') {
                allDeadOrGone = false;
                d.y += 8.5; // Fast straight drop
                if (d.y >= GROUND_Y + 20) {
                  d.state = 'DEAD';
                  playThud();
                }

              } else if (d.state === 'FLY_AWAY') {
                allDeadOrGone = false;
                d.y += d.vy;
                if (d.y < -80) {
                  d.state = 'DEAD';
                }
              }
            });

            // If all ducks in current wave are accounted for
            if (allDeadOrGone) {
              endWave();
            }

          } else if (currentState === STATE.FLY_AWAY) {
            // Ducks zooming off screen
            let allGone = true;
            ducks.forEach((d) => {
              if (d.state === 'FLY_AWAY') {
                d.y += d.vy;
                if (d.y > -80) {
                  allGone = false;
                } else {
                  d.state = 'DEAD';
                }
              }
            });

            if (allGone) {
              endWave();
            }

          } else if (currentState === STATE.WAVE_END) {
            waveEndTimer++;

            // Animate dog popup
            if (dog.y > dog.targetY) {
              dog.y -= 2.5;
            }

            if (dog.state === 'POPUP_LAUGH') {
              dog.laughBounces++;
            }

            if (waveEndTimer > 110) {
              // Dog retreats down
              dog.y += 4;
              if (dog.y >= GROUND_Y + 50) {
                dog.state = 'HIDDEN';
                advanceToNextWaveOrRound();
              }
            }

          } else if (currentState === STATE.ROUND_SUMMARY) {
            waveEndTimer++;
            if (waveEndTimer > 140) {
              currentRound++;
              resetRoundStats();
              startRoundIntro();
            }
          }
        }

        // --- RENDER LOOP ---
        function render() {
          ctx.save();

          // Screen Shake on Gunfire
          if (screenShake > 0.5) {
            const dx = (Math.random() - 0.5) * screenShake * 2;
            const dy = (Math.random() - 0.5) * screenShake * 2;
            ctx.translate(dx, dy);
          }

          // 1. Sky & Background Scenery
          drawBackground();

          // 2. Rising Dog (if walking/intro or behind grass)
          if (currentState === STATE.ROUND_INTRO || currentState === STATE.WAVE_END) {
            drawDog();
          }

          // 3. Ducks in Flight & Dropping
          ducks.forEach((d) => {
            if (d.state !== 'DEAD' || d.y <= GROUND_Y) {
              drawDuck(d);
            }
          });

          // 4. Foreground Grass (Covers ducks on ground and lower body of dog)
          drawForegroundGrass();

          // 5. Floating Score indicators
          drawFloatingScores();

          // 6. Banners & Notifications
          drawBanners();

          // 7. Bottom Retro HUD Bar
          drawHUD();

          // 8. Start & Game Over UI Overlays
          if (currentState === STATE.START_SCREEN) {
            drawStartScreen();
          } else if (currentState === STATE.GAME_OVER) {
            drawGameOverScreen();
          } else if (currentState === STATE.ROUND_SUMMARY) {
            drawRoundSummary();
          }

          // 9. Retro CRT White Gunshot Flash (Classic NES Zapper flash)
          if (flashFrames > 0) {
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
          }

          // 10. Custom Aim Reticle
          drawReticle();

          ctx.restore();
        }

        // --- MAIN ANIMATION LOOP ---
        function gameLoop() {
          if (currentState !== STATE.PAUSED) {
            update();
          }
          render();
          requestAnimationFrame(gameLoop);
        }

        // --- EVENT HANDLERS & INPUT MAPPING ---
        function getCanvasCoords(e) {
          const rect = canvas.getBoundingClientRect();
          const scaleX = GAME_WIDTH / rect.width;
          const scaleY = GAME_HEIGHT / rect.height;

          let clientX = e.clientX;
          let clientY = e.clientY;

          if (e.touches && e.touches.length > 0) {
            clientX = e.touches[0].clientX;
            clientY = e.touches[0].clientY;
          }

          return {
            x: Math.max(0, Math.min(GAME_WIDTH, (clientX - rect.left) * scaleX)),
            y: Math.max(0, Math.min(GAME_HEIGHT, (clientY - rect.top) * scaleY))
          };
        }

        window.addEventListener('mousemove', (e) => {
          const coords = getCanvasCoords(e);
          reticleX = coords.x;
          reticleY = coords.y;
          isCursorInside = true;
        });

        canvas.addEventListener('mouseenter', () => {
          isCursorInside = true;
        });

        canvas.addEventListener('mouseleave', () => {
          isCursorInside = false;
        });

        canvas.addEventListener('mousedown', (e) => {
          if (e.button === 0) { // Left click
            const coords = getCanvasCoords(e);
            reticleX = coords.x;
            reticleY = coords.y;
            fireShot();
          }
        });

        // Mobile Touch Support
        canvas.addEventListener('touchstart', (e) => {
          e.preventDefault();
          const coords = getCanvasCoords(e);
          reticleX = coords.x;
          reticleY = coords.y;
          isCursorInside = true;
          fireShot();
        }, { passive: false });

        canvas.addEventListener('touchmove', (e) => {
          e.preventDefault();
          const coords = getCanvasCoords(e);
          reticleX = coords.x;
          reticleY = coords.y;
        }, { passive: false });

        // Keyboard Shortcuts
        window.addEventListener('keydown', (e) => {
          if (e.code === 'KeyM') {
            toggleMute();
          } else if (e.code === 'KeyP') {
            togglePause();
          } else if (e.code === 'Space') {
            fireShot();
          }
        });

        // UI Toolbar Buttons
        const btnSound = document.getElementById('btn-sound');
        const btnCrt = document.getElementById('btn-crt');
        const btnFullscreen = document.getElementById('btn-fullscreen');
        const crtOverlay = document.getElementById('crt-effect');

        function toggleMute() {
          initAudio();
          isMuted = !isMuted;
          btnSound.textContent = isMuted ? '🔇 AUDIO OFF' : '🔊 AUDIO ON';
        }

        function togglePause() {
          if (currentState === STATE.PAUSED) {
            currentState = previousState;
          } else if (currentState === STATE.PLAYING || currentState === STATE.ROUND_INTRO) {
            previousState = currentState;
            currentState = STATE.PAUSED;
          }
        }

        btnSound.addEventListener('click', (e) => {
          e.stopPropagation();
          toggleMute();
        });

        btnCrt.addEventListener('click', (e) => {
          e.stopPropagation();
          crtOverlay.classList.toggle('disabled');
          const isEnabled = !crtOverlay.classList.contains('disabled');
          btnCrt.textContent = isEnabled ? '📺 CRT ON' : '📺 CRT OFF';
        });

        btnFullscreen.addEventListener('click', (e) => {
          e.stopPropagation();
          const wrapper = document.getElementById('game-wrapper');
          if (!document.fullscreenElement) {
            wrapper.requestFullscreen().catch(() => {});
          } else {
            document.exitFullscreen().catch(() => {});
          }
        });

        // Start animation loop
        requestAnimationFrame(gameLoop);
      })();
    </script>
  </body>
</html>
